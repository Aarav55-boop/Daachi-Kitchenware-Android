
name: Build Daachi Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Daachi Kitchenware
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Validate Android XML Files
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          paths = [
              "app/src/main/AndroidManifest.xml"
          ]

          for root, dirs, files in os.walk("app/src/main/res"):
              for filename in files:
                  if filename.endswith(".xml"):
                      paths.append(os.path.join(root, filename))

          errors = 0

          for path in paths:
              try:
                  ET.parse(path)
                  print(f"OK: {path}")
              except ET.ParseError as error:
                  print(f"ERROR: {path}: {error}")
                  errors += 1

          if errors:
              print(f"XML validation failed: {errors} file(s)")
              sys.exit(1)

          print("All Android XML files passed validation.")
          PY

      - name: Build Debug APK
        shell: bash
        run: |
          gradle --no-daemon \
            --console=plain \
            --stacktrace \
            :app:assembleDebug

      - name: Build Release AAB
        shell: bash
        run: |
          gradle --no-daemon \
            --console=plain \
            --stacktrace \
            :app:bundleRelease

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Daachi-Kitchenware-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Daachi-Kitchenware-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
